<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="amzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131921" />
      <stop offset="60%" stop-color="#232f3e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="amzAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#febd69" />
    </linearGradient>
    <linearGradient id="amzCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#amzBg)" />

  <!-- Ambient Amber Glow -->
  <circle cx="200" cy="120" r="140" fill="#ff9900" opacity="0.12" filter="blur(35px)" />
  <circle cx="650" cy="360" r="150" fill="#febd69" opacity="0.08" filter="blur(35px)" />

  <!-- Window Frame -->
  <rect x="60" y="45" width="680" height="390" rx="16" fill="#eaeded" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Top Dark Amazon Header Bar -->
  <path d="M 60 61 A 16 16 0 0 1 76 45 L 724 45 A 16 16 0 0 1 740 61 L 740 92 L 60 92 Z" fill="#131921" />
  <circle cx="85" cy="68" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="105" cy="68" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="125" cy="68" r="6" fill="#10b981" opacity="0.8" />

  <!-- Amazon Logo Simulation -->
  <text x="160" y="74" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="900" letter-spacing="-0.5">amazon<tspan fill="#ff9900">.in</tspan></text>
  <path d="M 160 78 Q 185 86 210 79" fill="none" stroke="#ff9900" stroke-width="2" stroke-linecap="round" />

  <!-- Search Bar -->
  <rect x="235" y="56" width="310" height="26" rx="4" fill="#ffffff" />
  <text x="245" y="73" fill="#64748b" font-family="sans-serif" font-size="10">Search Amazon.in</text>
  <path d="M 520 56 L 545 56 A 4 4 0 0 1 545 82 L 520 82 Z" fill="#febd69" />
  <circle cx="532" cy="69" r="4" fill="none" stroke="#131921" stroke-width="1.5" />

  <!-- Nav Items Right -->
  <text x="575" y="67" fill="#cccccc" font-family="sans-serif" font-size="9">Hello, Sign in</text>
  <text x="575" y="78" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">Account &amp; Lists</text>

  <text x="655" y="67" fill="#cccccc" font-family="sans-serif" font-size="9">Returns</text>
  <text x="655" y="78" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">&amp; Orders</text>

  <text x="705" y="74" fill="#ff9900" font-family="sans-serif" font-size="12" font-weight="800">🛒 Cart</text>

  <!-- Secondary Subnav -->
  <rect x="60" y="92" width="680" height="24" fill="#232f3e" />
  <text x="80" y="108" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">☰ All</text>
  <text x="120" y="108" fill="#e2e8f0" font-family="sans-serif" font-size="10">Amazon miniTV</text>
  <text x="210" y="108" fill="#e2e8f0" font-family="sans-serif" font-size="10">Sell</text>
  <text x="250" y="108" fill="#e2e8f0" font-family="sans-serif" font-size="10">Best Sellers</text>
  <text x="325" y="108" fill="#e2e8f0" font-family="sans-serif" font-size="10">Today's Deals</text>
  <text x="410" y="108" fill="#e2e8f0" font-family="sans-serif" font-size="10">Mobiles</text>
  <text x="470" y="108" fill="#e2e8f0" font-family="sans-serif" font-size="10">Electronics</text>

  <!-- Hero Banner Slider -->
  <rect x="75" y="125" width="650" height="110" rx="6" fill="#374151" />
  <text x="100" y="165" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="800">Great Republic Festival</text>
  <text x="100" y="185" fill="#febd69" font-family="sans-serif" font-size="13" font-weight="600">Up to 75% Off | Electronics, Fashion &amp; Laptops</text>
  <rect x="100" y="198" width="110" height="22" rx="4" fill="#ff9900" />
  <text x="155" y="213" fill="#131921" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Shop Now</text>

  <!-- Product Cards Grid (Replication of 4 cards) -->
  <!-- Card 1 -->
  <rect x="75" y="248" width="150" height="170" rx="6" fill="#ffffff" stroke="#e2e8f0" />
  <text x="87" y="270" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Appliances for Home</text>
  <rect x="87" y="280" width="126" height="95" rx="4" fill="#f1f5f9" />
  <circle cx="150" cy="327" r="22" fill="#cbd5e1" />
  <text x="87" y="398" fill="#007185" font-family="sans-serif" font-size="9" font-weight="600">See more offers</text>

  <!-- Card 2 -->
  <rect x="241" y="248" width="150" height="170" rx="6" fill="#ffffff" stroke="#e2e8f0" />
  <text x="253" y="270" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Starting ₹199 | Styles</text>
  <rect x="253" y="280" width="126" height="95" rx="4" fill="#f1f5f9" />
  <rect x="268" y="295" width="45" height="40" rx="3" fill="#cbd5e1" />
  <rect x="320" y="295" width="45" height="40" rx="3" fill="#94a3b8" />
  <rect x="268" y="340" width="45" height="25" rx="3" fill="#94a3b8" />
  <rect x="320" y="340" width="45" height="25" rx="3" fill="#cbd5e1" />
  <text x="253" y="398" fill="#007185" font-family="sans-serif" font-size="9" font-weight="600">Explore fashion</text>

  <!-- Card 3 -->
  <rect x="407" y="248" width="150" height="170" rx="6" fill="#ffffff" stroke="#e2e8f0" />
  <text x="419" y="270" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Up to 60% off Laptops</text>
  <rect x="419" y="280" width="126" height="95" rx="4" fill="#f1f5f9" />
  <rect x="439" y="305" width="86" height="50" rx="3" fill="#475569" />
  <text x="419" y="398" fill="#007185" font-family="sans-serif" font-size="9" font-weight="600">Check deals</text>

  <!-- Card 4 -->
  <rect x="573" y="248" width="150" height="170" rx="6" fill="#ffffff" stroke="#e2e8f0" />
  <text x="585" y="270" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Pure HTML/CSS/JS</text>
  <rect x="585" y="280" width="126" height="95" rx="4" fill="#1e293b" />
  <text x="648" y="325" fill="#ff9900" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">HTML5 • CSS3</text>
  <text x="648" y="345" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Responsive Grid</text>
  <text x="585" y="398" fill="#007185" font-family="sans-serif" font-size="9" font-weight="600">View code</text>
</svg>
