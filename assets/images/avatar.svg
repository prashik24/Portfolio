<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="avatarBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Gradient -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="url(#avatarBorder)" stroke-width="4" stroke-dasharray="8 4" />
  
  <!-- Base Circle -->
  <circle cx="120" cy="120" r="106" fill="url(#avatarBg)" />

  <!-- Geometric Accent Pattern -->
  <g opacity="0.15" stroke="#818cf8" stroke-width="1.5">
    <circle cx="120" cy="120" r="75" fill="none" />
    <polygon points="120,45 185,157 55,157" fill="none" />
    <polygon points="120,195 185,83 55,83" fill="none" />
  </g>

  <!-- Monogram Initials PH -->
  <text x="120" y="138" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="2"
        fill="url(#textGrad)" 
        text-anchor="middle">PH</text>

  <!-- Bottom Subtitle Badge -->
  <rect x="68" y="158" width="104" height="22" rx="11" fill="rgba(99, 102, 241, 0.25)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
  <text x="120" y="173" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="10" 
        font-weight="700" 
        letter-spacing="1.5"
        fill="#38bdf8" 
        text-anchor="middle">DEV • CP</text>
</svg>
