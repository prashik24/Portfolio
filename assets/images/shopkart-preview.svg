<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="skAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#skBg)" />

  <!-- Subtle glow -->
  <circle cx="680" cy="140" r="140" fill="#10b981" opacity="0.12" filter="blur(30px)" />
  <circle cx="160" cy="380" r="160" fill="#06b6d4" opacity="0.1" filter="blur(35px)" />

  <!-- App Window -->
  <rect x="60" y="45" width="680" height="390" rx="16" fill="#0b0f19" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="45" width="680" height="42" rx="16" fill="rgba(255, 255, 255, 0.04)" />
  <circle cx="85" cy="66" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="105" cy="66" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="125" cy="66" r="6" fill="#10b981" opacity="0.8" />
  <text x="400" y="72" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">shopkart.store — Enterprise E-Commerce & Admin Suite</text>

  <!-- Left Stats/Filters Pane -->
  <rect x="80" y="105" width="190" height="305" rx="10" fill="url(#glassCard)" stroke="rgba(255,255,255,0.06)" />
  <text x="96" y="132" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700">Catalog Filters</text>
  
  <rect x="96" y="148" width="158" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" />
  <text x="110" y="166" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">⚡ Electronics & Gear</text>
  
  <rect x="96" y="186" width="158" height="26" rx="6" fill="rgba(255,255,255,0.03)" />
  <text x="110" y="203" fill="#94a3b8" font-family="sans-serif" font-size="11">Apparel & Footwear</text>
  
  <rect x="96" y="222" width="158" height="26" rx="6" fill="rgba(255,255,255,0.03)" />
  <text x="110" y="239" fill="#94a3b8" font-family="sans-serif" font-size="11">Home & Living</text>

  <!-- Admin CRUD Badge -->
  <rect x="96" y="280" width="158" height="110" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" />
  <text x="110" y="304" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">ADMIN CONTROL PANEL</text>
  <text x="110" y="324" fill="#94a3b8" font-family="sans-serif" font-size="10">Active Inventory</text>
  <text x="110" y="344" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">1,248 Items</text>
  <rect x="110" y="358" width="130" height="6" rx="3" fill="#334155" />
  <rect x="110" y="358" width="95" height="6" rx="3" fill="url(#skAccent)" />

  <!-- Right Product Grid Area -->
  <rect x="290" y="105" width="205" height="185" rx="10" fill="url(#glassCard)" stroke="rgba(255,255,255,0.06)" />
  <rect x="306" y="120" width="173" height="90" rx="6" fill="#1e293b" />
  <circle cx="392" cy="165" r="24" fill="#06b6d4" opacity="0.3" />
  <text x="306" y="228" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Wireless Noise-Cancel Pro</text>
  <text x="306" y="248" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="700">₹ 8,499</text>
  <rect x="424" y="234" width="55" height="22" rx="4" fill="#10b981" />
  <text x="451" y="249" fill="#042f2e" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ADD</text>

  <!-- Right Product 2 -->
  <rect x="515" y="105" width="205" height="185" rx="10" fill="url(#glassCard)" stroke="rgba(255,255,255,0.06)" />
  <rect x="531" y="120" width="173" height="90" rx="6" fill="#1e293b" />
  <circle cx="617" cy="165" r="24" fill="#3b82f6" opacity="0.3" />
  <text x="531" y="228" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Mechanical Keychron K2</text>
  <text x="531" y="248" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="700">₹ 7,299</text>
  <rect x="649" y="234" width="55" height="22" rx="4" fill="#10b981" />
  <text x="676" y="249" fill="#042f2e" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ADD</text>

  <!-- Bottom Checkout & Security Bar -->
  <rect x="290" y="305" width="430" height="105" rx="10" fill="url(#glassCard)" stroke="rgba(255,255,255,0.06)" />
  <text x="310" y="332" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Secure Checkout Pipeline</text>
  
  <!-- Steps -->
  <circle cx="325" cy="365" r="12" fill="#10b981" />
  <text x="325" y="369" fill="#042f2e" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓</text>
  <text x="325" y="392" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Brevo OTP</text>

  <line x1="345" y1="365" x2="425" y2="365" stroke="#10b981" stroke-width="2" />
  
  <circle cx="445" cy="365" r="12" fill="#10b981" />
  <text x="445" y="369" fill="#042f2e" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓</text>
  <text x="445" y="392" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Cart State</text>

  <line x1="465" y1="365" x2="545" y2="365" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />

  <circle cx="565" cy="365" r="12" fill="#38bdf8" />
  <text x="565" y="369" fill="#082f49" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">3</text>
  <text x="565" y="392" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Razorpay</text>

  <line x1="585" y1="365" x2="655" y2="365" stroke="#475569" stroke-width="2" />

  <circle cx="675" cy="365" r="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="675" y="369" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">4</text>
  <text x="675" y="392" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Invoice</text>
</svg>
