<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="140" r="130" fill="#6366f1" opacity="0.18" filter="url(#glowFilter)" />
  <circle cx="640" cy="340" r="150" fill="#ec4899" opacity="0.15" filter="url(#glowFilter)" />

  <!-- App Window Container -->
  <rect x="60" y="45" width="680" height="390" rx="16" fill="#0d1117" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="60" y="45" width="680" height="42" rx="16" fill="rgba(255, 255, 255, 0.04)" />
  <circle cx="85" cy="66" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="105" cy="66" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="125" cy="66" r="6" fill="#10b981" opacity="0.8" />
  <text x="400" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">ontrip.ai — Autonomous Gemini Travel Architect</text>

  <!-- Sidebar Component -->
  <rect x="80" y="105" width="180" height="305" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" />
  <rect x="98" y="125" width="85" height="12" rx="4" fill="#6366f1" opacity="0.7" />
  <rect x="98" y="150" width="144" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
  <rect x="98" y="185" width="144" height="24" rx="6" fill="rgba(255,255,255,0.04)" />
  <rect x="98" y="220" width="144" height="24" rx="6" fill="rgba(255,255,255,0.04)" />
  <text x="98" y="280" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">LIVE SOCKET MESSAGING</text>
  <rect x="98" y="295" width="144" height="45" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" />
  <circle cx="115" cy="318" r="8" fill="#10b981" />
  <rect x="132" y="312" width="90" height="6" rx="3" fill="#cbd5e1" />
  <rect x="132" y="323" width="60" height="4" rx="2" fill="#64748b" />

  <!-- Main Travel Canvas -->
  <rect x="280" y="105" width="440" height="180" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" />
  <text x="305" y="135" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Tokyo 5-Day Smart Exploration</text>
  <rect x="305" y="145" width="120" height="18" rx="9" fill="rgba(99, 102, 241, 0.25)" />
  <text x="365" y="158" fill="#818cf8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">✨ Gemini AI Optimized</text>

  <!-- Route Line Simulation -->
  <path d="M 310 230 C 370 190, 440 260, 520 200 S 640 240, 680 210" fill="none" stroke="url(#primaryGlow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4" />
  <circle cx="310" cy="230" r="7" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
  <circle cx="450" cy="225" r="5" fill="#ec4899" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="560" cy="205" r="5" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="680" cy="210" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" />

  <!-- Bottom Metric Cards -->
  <rect x="280" y="300" width="135" height="110" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" />
  <text x="295" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11">FastAPI ML Pipeline</text>
  <text x="295" y="355" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="700">Cosine Sim</text>
  <text x="295" y="380" fill="#64748b" font-family="sans-serif" font-size="10">Zero-downtime fallback</text>

  <rect x="430" y="300" width="135" height="110" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" />
  <text x="445" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11">Razorpay & jsPDF</text>
  <text x="445" y="355" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="700">Instant Pay</text>
  <text x="445" y="380" fill="#64748b" font-family="sans-serif" font-size="10">Automated trip billing</text>

  <rect x="580" y="300" width="140" height="110" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" />
  <text x="595" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11">Auth & RBAC</text>
  <text x="595" y="355" fill="#f43f5e" font-family="sans-serif" font-size="20" font-weight="700">OAuth 2.0</text>
  <text x="595" y="380" fill="#64748b" font-family="sans-serif" font-size="10">HTTP-Only JWT Cookie</text>
</svg>
